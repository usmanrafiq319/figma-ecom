<!-- Main Navbar -->
<nav class="bg-global-white py-4 global-px shadow-sm">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
    
    <!-- Left Section: Logo & Links -->
    <div class="flex items-center gap-8">
      <!-- Logo -->
      <a routerLink='' class="text-2xl font-black tracking-tight text-black">SHOP.CO</a>
      
      <!-- Navigation Links -->
      <div class="hidden items-center gap-6 text-sm font-normal text-black lg:flex">
        <a href="#" class="flex items-center gap-1 hover:text-global-grey-600">
          Shop
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="h-3 w-3 mt-0.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </a>
        <a href="#" class="hover:text-global-grey-600">On Sale</a>
        <a href="#" class="hover:text-global-grey-600">New Arrivals</a>
        <a href="#" class="hover:text-global-grey-600">Brands</a>
      </div>
    </div>

    <!-- Center Section: Search Bar -->
    <div class="relative flex-1 max-w-xl hidden md:block">
      <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5 text-gray-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
      </span>
      <input 
        type="text" 
        placeholder="Search for products..." 
        class="w-full rounded-full bg-global-light py-3 pl-12 pr-4 text-sm text-global-light placeholder-gray-400 outline-none focus:ring-1 focus:ring-black"
      />
    </div>

    <!-- Right Section: Actions -->
    <div class="flex items-center gap-4 text-black">
      <!-- Mobile Search Icon -->
      <button class="block md:hidden p-1 hover:text-global-grey-600" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
      </button>

      <!-- Cart Icon -->
      <a routerLink='/cart' class="p-1 hover:text-global-grey-600" aria-label="Cart">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
        </svg>
      </a>

      @if (userlogedin()) {
        <!-- Desktop View -->
        <div class="hidden md:flex items-center gap-4">
          <!-- Clean Admin Dashboard Button (Only links to dashboard page) -->
          @if (isAdmin()) {
            <a 
              routerLink="/admin-dashboard" 
              class="px-3 py-1.5 text-sm font-semibold rounded-md bg-gray-100 hover:bg-gray-200 transition-colors"
            >
              Admin Dashboard
            </a>
          }

          <a routerLink="/profile" class="p-1 hover:text-global-grey-600" aria-label="Account">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </a>
          <button (click)="logout()" class="cursor-pointer hover:text-global-grey-600">Log Out</button>
        </div>

        <!-- Mobile View: Dropdown Menu -->
        <div class="relative md:hidden" (clickOutside)="isDropdownOpen = false">
          <button 
            (click)="isDropdownOpen = !isDropdownOpen" 
            class="p-1 hover:text-global-grey-600" 
            aria-label="Account menu"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-6 w-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>

          @if (isDropdownOpen) {
            <div class="absolute right-0 mt-2 w-56 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
              
              <!-- Admin Dashboard Link (Mobile Dropdown) -->
              @if (isAdmin()) {
                <a 
                  routerLink="/admin-dashboard" 
                  class="block px-4 py-2 text-sm font-semibold text-blue-600 hover:bg-gray-100"
                  (click)="isDropdownOpen = false"
                >
                  Admin Dashboard
                </a>
                <div class="border-t border-gray-100 my-1"></div>
              }

              <a 
                routerLink="/profile" 
                class="block px-4 py-2 text-sm hover:bg-gray-100"
                (click)="isDropdownOpen = false"
              >
                Profile
              </a>
              <button 
                (click)="logout(); isDropdownOpen = false" 
                class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100"
              >
                Log Out
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login" class="cursor-pointer hover:text-global-grey-600">Login</a>
      }
    </div>

  </div>
</nav>
