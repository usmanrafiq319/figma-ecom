<div

    class="flex flex-row items-center justify-between mx-auto w-full h-12 rounded-full border border-2-global-dark-200 py-2 px-4 ">
    <button class="text-2xl font-bold cursor-pointer" (click)="decrement()">-</button>
    <span>{{amount()}}</span>
    <button class="text-2xl font-bold cursor-pointer" (click)="increment()">+</button>

</div>
