<div class="flex global-px items-center justify-center py-2">
<div class="bg-[#f0f0f0] p-6 md:p-12 rounded-3xl max-w-6xl mx-auto">
  <!-- Section Title -->
  <h2 class="text-2xl md:text-4xl font-extrabold text-center tracking-tight text-black mb-6 md:mb-10 uppercase">
    Browse by Dress Style
  </h2>

  <!-- Responsive Grid Container -->
  <div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-5">
    
    <!-- 1. Casual (Takes 1 column on mobile, 1 column on desktop) -->
    <div class="relative h-[180px] md:h-[280px] bg-white rounded-2xl overflow-hidden group">
      <span class="absolute top-4 left-6 z-10 text-xl md:text-2xl font-bold text-black">Casual</span>
      <img src="logos/party.png" alt="Casual Style" class="w-full h-full object-cover object-right-top" />
    </div>

    <!-- 2. Formal (Takes 1 column on mobile, spans 2 columns on desktop) -->
    <div class="relative h-[180px] md:h-[280px] bg-white rounded-2xl overflow-hidden col-span-1 md:col-span-2">
      <span class="absolute top-4 left-6 z-10 text-xl md:text-2xl font-bold text-black">Formal</span>
      <img src="logos/party.png" alt="Formal Style" class="w-full h-full object-cover object-right-top" />
    </div>

    <!-- 3. Party (Takes 1 column on mobile, spans 2 columns on desktop) -->
    <div class="relative h-[180px] md:h-[280px] bg-white rounded-2xl overflow-hidden col-span-1 md:col-span-2">
      <span class="absolute top-4 left-6 z-10 text-xl md:text-2xl font-bold text-black">Party</span>
      <img src="logos/party.png" alt="Party Style" class="w-full h-full object-cover object-center" />
    </div>

    <!-- 4. Gym (Takes 1 column on mobile, 1 column on desktop) -->
    <div class="relative h-[180px] md:h-[280px] bg-white rounded-2xl overflow-hidden">
      <span class="absolute top-4 left-6 z-10 text-xl md:text-2xl font-bold text-black">Gym</span>
      <img src="logos/party.png" alt="Gym Style" class="w-full h-full object-cover object-right-top" />
    </div>

  </div>
</div>


</div>
