<div class="flex flex-col md:flex-row justify-between items-start px-6 py-12 gap-8 w-full max-w-7xl mx-auto">

    <!-- Left Side: Cart Items Container (Takes up ~66% width on desktop) -->
    <div
        class="flex flex-col items-stretch justify-start rounded-2xl border-2 border-global-light p-6 w-full md:w-2/3 bg-white shadow-sm">
        <h1 class="text-slate-900 text-2xl font-bold mb-6">Your Cart</h1>

        <div class="flex flex-col gap-4 mb-6">
            @for (item of cart()?.cartItems; track item.productId) {
            <div
                class="p-4 flex flex-row items-center justify-start gap-4 border-b-1 border-global-light last:border-b-0 w-full">
                <!-- Image Wrapper -->
                <div class="flex justify-center items-center shrink-0">
                    <img src="{{item.url}}" alt="{{item.title}}"
                        class="h-20 w-20 object-contain bg-gray-50 rounded-xl p-2">
                </div>
                <!-- Item Details -->
                <div class="flex justify-between items-start flex-col md:flex-row  gap-2 w-full">
                    <div class="flex justify-start items-start flex-col gap-1">
                        <h2 class="font-medium text-slate-800"> {{item.title}}</h2>
                        <span class="text-sm text-gray-500">Price: ${{item.price}}</span>
                        <span class="text-sm font-semibold text-slate-700">Qty: {{item.quantity}}</span>

                    </div>
                    <app-quantity [amount]="item.quantity" [id]="item.productId" (cartUpdated)="this.checkout();"   class="w-full md:w-24"  />
                </div>

            </div>
            }
        </div>


    </div>

    <!-- Right Side: Order Summary (Takes up ~33% width on desktop) -->
    <div
        class="flex flex-col items-stretch justify-start rounded-2xl border-2 border-global-light p-6 w-full md:w-1/3 bg-white shadow-sm sticky top-4">
        <h2 class="text-xl font-bold text-slate-900 mb-4">Order Summary</h2>
        <div class="flex justify-between items-center py-2 font-semibold text-lg border-t border-gray-100 mt-2 pt-4">
            <span>Total Sum: ${{ cart()?.total }}</span>
            <span></span>
        </div>
        <!-- Checkout Button -->
        <button
            class="w-full flex items-center justify-center rounded-xl bg-slate-900 text-white py-3 px-6 font-semibold hover:bg-slate-800 transition cursor-pointer"
            >
            Purchased Items
        </button>
    </div>

</div>
