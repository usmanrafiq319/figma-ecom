<div class="min-h-[85vh] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md bg-white rounded-3xl border border-gray-100 shadow-xl shadow-gray-100/50 p-6 sm:p-10 transition-all">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-black tracking-tight mb-1">
        Create Account
      </h1>
      <p class="text-sm text-gray-500">Sign up to get started with your account</p>
    </div>

    <!-- Error Message -->
    @if (errorMessage) {
      <div 
        class="mb-6 flex items-center justify-between gap-2 text-sm text-red-600 bg-red-50/80 border border-red-200/60 rounded-xl px-4 py-3 text-center" 
        role="alert"
      >
        <span class="w-full">{{ errorMessage }}</span>
      </div>
    }

    <!-- Form Body -->
    <form (ngSubmit)="registerUser()" class="flex flex-col gap-4">
      
      <!-- Username Field -->
      <div class="flex flex-col gap-1.5">
        <label for="username" class="text-xs font-semibold text-gray-700 uppercase tracking-wider ml-1">
          Username
        </label>
        <input
          id="username"
          type="text"
          [(ngModel)]="user.userName"
          name="username"
          autocomplete="username"
          placeholder="Choose a username"
          required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 text-black text-sm rounded-xl outline-none focus:bg-white focus:border-black focus:ring-2 focus:ring-black/5 transition disabled:opacity-60"
          [disabled]="isLoading"
        />
      </div>

      <!-- Email Field -->
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-xs font-semibold text-gray-700 uppercase tracking-wider ml-1">
          Email Address
        </label>
        <input
          id="email"
          type="email"
          [(ngModel)]="user.email"
          name="email"
          autocomplete="email"
          placeholder="name@example.com"
          required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 text-black text-sm rounded-xl outline-none focus:bg-white focus:border-black focus:ring-2 focus:ring-black/5 transition disabled:opacity-60"
          [disabled]="isLoading"
        />
      </div>

      <!-- Password Field -->
      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-xs font-semibold text-gray-700 uppercase tracking-wider ml-1">
          Password
        </label>
        <input
          id="password"
          type="password"
          [(ngModel)]="user.password"
          name="password"
          placeholder="••••••••"
          autocomplete="new-password"
          required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 text-black text-sm rounded-xl outline-none focus:bg-white focus:border-black focus:ring-2 focus:ring-black/5 transition disabled:opacity-60"
          [disabled]="isLoading"
        />
      </div>

      <!-- Confirm Password Field -->
      <div class="flex flex-col gap-1.5">
        <label for="confirmPassword" class="text-xs font-semibold text-gray-700 uppercase tracking-wider ml-1">
          Confirm Password
        </label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 text-black text-sm rounded-xl outline-none focus:bg-white focus:border-black focus:ring-2 focus:ring-black/5 transition disabled:opacity-60"
          [disabled]="isLoading"
        />
      </div>

      <!-- Password Mismatch Inline Validation -->
      @if (confirmPassword && user.password !== confirmPassword) {
        <p class="text-xs font-medium text-red-500 ml-1 -mt-1">
          Passwords do not match.
        </p>
      }

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full mt-3 py-3.5 px-5 bg-black text-white text-sm font-semibold rounded-xl hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black active:scale-[0.99] transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 flex items-center justify-center"
        [disabled]="
          isLoading ||
          !user.userName ||
          !user.email ||
          !user.password ||
          !confirmPassword ||
          user.password !== confirmPassword
        "
      >
        @if (isLoading) {
          <span class="inline-flex items-center">
            <svg class="animate-spin -ml-1 mr-2.5 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l2.647-2.647z"></path>
            </svg>
            Creating account...
          </span>
        } @else {
          Create Account
        }
      </button>

    </form>

    <!-- Footer Login Link -->
    <div class="mt-8 text-center text-sm text-gray-500">
      Already have an account?
      <a
        routerLink="/login"
        class="font-semibold text-black hover:underline cursor-pointer ml-1"
      >
        Sign In
      </a>
    </div>

  </div>
</div>
