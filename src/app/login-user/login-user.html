<div class="flex justify-center flex-col items-center global-px py-20 gap-12 m-12 bg-global-light rounded-2xl">
    <h1 class="text-2xl text-black">Enter Credentials</h1>
    
    <!-- Error Message Display -->
    @if (errorMessage) {
        <div class="text-red-600 bg-red-50 border border-red-200 rounded-md px-4 py-2 w-2/3 text-center">
            {{ errorMessage }}
        </div>
    }

    <input 
        type="text" 
        [(ngModel)]="user.username" 
        name="username" 
        placeholder="Enter User Name" 
        class="flex w-2/3 p-3 font-medium border bg-global-white border-global-grey-100 hover:border-global-dark-100 rounded-md"
        [disabled]="isLoading"
    >
    
    <input 
        type="password" 
        [(ngModel)]="user.password" 
        placeholder="Enter Password" 
        name="password" 
        class="flex w-2/3 p-3 border bg-global-white border-global-grey-100 font-medium hover:border-global-dark-100 rounded-md"
        [disabled]="isLoading"
        (keydown.enter)="authuser()"
    >
    
    <button 
        (click)="authuser()" 
        class="border border-global-grey-100 py-2 px-4 rounded-sm hover:border-global-dark-100 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="isLoading || !user.username || !user.password"
    >
        @if (isLoading) {
            <span class="inline-flex items-center">
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Logging in...
            </span>
        } @else {
            Login
        }
    </button>
</div>
